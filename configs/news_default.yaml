data_root: "Output_total/News/artifacts"
inputs_root: "Output_total/News/inputs"

news:
  collector: "google_news_rss"
  collection_days: 90
  # Search in seven-day ranges, then merge semantic duplicates within each ISO
  # calendar week.
  collection_chunk_days: 7
  query_language: "ko"
  max_results: 200
  # After seven-day semantic duplicate merging, keep 15 embedding candidates per
  # ISO week, rerank them, retain 5 per week for summarization, and expose the
  # global top 20 events as raw News-Agent evidence.
  weekly_embedding_candidates: 15
  weekly_rerank_top_k: 5
  event_top_k: 20
  # Deprecated compatibility key; event_top_k takes precedence as the final
  # global News-Agent event budget.
  total_max_results: null
  dedup_on_url: true

dart:
  api_key_env: "DART_API_KEY"
  fetch_lookback_days: 550
  list_timeout_seconds: 20
  document_timeout_seconds: 30
  document_max_retries: 2
  document_retry_delay_seconds: 0.5
  parser_py_path: null
  sections_to_extract:
    - "사업의 개요"
    - "주요 제품 및 서비스"
    - "원재료 및 생산설비"
    - "주요계약 및 연구개발활동"
  chunking:
    target_char_min: 40
    target_char_max: 140
    hard_char_max: 220
    min_char_drop: 25
    topk_per_section:
      overview: 6
      products: 10
      materials: 8
      facilities: 8
      contracts: 6
      rnd: 6
    diversity:
      enabled: true
      cosine_skip_threshold: 0.80

models:
  embedding_model_name: "BAAI/bge-m3"
  reranker_model_name: "BAAI/bge-reranker-v2-m3"
  device: "cuda"
  batch_size: 32

clustering:
  method: "cosine_connected_components"
  time_window_hours: 168
  similarity_threshold: 0.88
  min_cluster_size: 2
  min_samples: 1

scoring:
  alpha: 0.75
  beta: 0.15
  gamma: 0.10
  delta: 0.05
  tau_hours: 48
  mention_transform: "log1p"
  impact_topk: 3
  rerank_all_chunks: true

outputs:
  format: ["parquet", "jsonl"]
  keep_cluster_members: true
