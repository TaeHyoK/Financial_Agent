[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-agent-final"
version = "0.1.0"
description = "Integrated financial analysis agents"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
  "hdbscan>=0.8",
  "sentence-transformers>=2.2",
  "kss>=6.0.6",
  "kiwipiepy>=0.17.0",
  "publicdatareader>=1.1.0",
  "pdfplumber>=0.11.9",
  "faiss-cpu>=1.13.2",
  "pdf2image>=1.17.0",
  "pymupdf>=1.27.1",
  "altair>=6.0.0",
  "vega-datasets>=0.9.0",
  "openai>=1.0",
  "tiktoken>=0.7",
  "tqdm>=4.66",
  "langgraph>=0.2",
  "pykrx>=1.0.48",
  "yfinance>=0.2.40",
  "matplotlib>=3.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
news-workflow = "Agent_Team.News_Agent.cli:main"
news-context-export = "Agent_Team.News_Agent.context_export:main"
news-analysis-agent = "Agent_Team.News_Agent.analysis_agent:main"
news-sy-agent = "Agent_Team.News_Agent.sy_agent_cli:main"
yfinance-pipeline = "Agent_Team.YFinance_Agent.run_pipeline:main"
agent-team-loop = "orchestration.cli:main"
financial-dart = "Agent_Team.Financial_Agent.main:main"
financial-index = "Agent_Team.Financial_Agent.financial_index_calculator:main"
financial-analyst-agent = "Agent_Team.Financial_Agent.langgraph_flow:main"
financial-sy-agent = "Agent_Team.Financial_Agent.SY_Agent.langgraph_flow:main"
financial-sy-pipeline = "Agent_Team.Financial_Agent.SY_Agent.run_pipeline:main"
strategy-agent = "Agent_Team.Strategy_Agent.cli:main"
financial-report = "orchestration.full_report_pipeline:main"
financial-report-ablation = "orchestration.ablation_experiment:main"
financial-report-evaluate = "orchestration.final_report_evaluation_cli:main"
strategy-bias-evaluation = "Agent_Team.Strategy_Agent.evaluate_recommendation_bias:main"
single-llm-baseline = "single_llm.cli:main"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = [
  "src",
  "src/Agent_Team/Visualization Agent",
  "src/Agent_Team/Writer Agent",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["Agent_Team*", "shared*", "orchestration*", "single_llm*"]
exclude = ["__pycache__*"]

[tool.setuptools.package-data]
"Agent_Team.Competitor_Agent" = ["prompts/*.md"]
orchestration = ["prompts/*.md"]
single_llm = ["prompts/*.md", "configs/*.yaml"]
