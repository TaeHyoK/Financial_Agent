[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-agent-final"
version = "1.0.0"
description = "Multi-agent pipeline for Korean listed-company research reports"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
  "sentence-transformers>=2.2",
  "kss>=6.0.6",
  "kiwipiepy>=0.17.0",
  "publicdatareader>=1.1.0",
  "pdfplumber>=0.11.9",
  "faiss-cpu>=1.13.2",
  "pdf2image>=1.17.0",
  "pymupdf>=1.27.1",
  "altair>=6.0.0",
  "vega-datasets>=0.9.0",
  "openai>=1.0",
  "tiktoken>=0.7",
  "tqdm>=4.66",
  "langgraph>=0.2",
  "pykrx>=1.0.48",
  "yfinance>=0.2.40",
  "matplotlib>=3.7",
  "python-dotenv>=1.0",
]

[project.scripts]
financial-report = "orchestration.full_report_pipeline:main"
agent-team-loop = "orchestration.cli:main"
financial-dart = "Agent_Team.Financial_Agent.main:main"
financial-index = "Agent_Team.Financial_Agent.financial_index_calculator:main"
financial-analyst-agent = "Agent_Team.Financial_Agent.langgraph_flow:main"
news-workflow = "Agent_Team.News_Agent.cli:main"
news-analysis-agent = "Agent_Team.News_Agent.analysis_agent:main"
yfinance-pipeline = "Agent_Team.YFinance_Agent.run_pipeline:main"
strategy-agent = "Agent_Team.Strategy_Agent.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["Agent_Team*", "shared*", "orchestration*"]
exclude = ["__pycache__*"]

[tool.setuptools.package-data]
"Agent_Team.Competitor_Agent" = ["prompts/*.md"]
"Agent_Team.Strategy_Agent" = ["prompts/*.md"]
