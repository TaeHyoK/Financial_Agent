[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-agent-final"
version = "1.0.0"
description = "Multi-agent pipeline for Korean listed-company research reports"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "sentence-transformers>=2.2",
  "kss>=6.0.6",
  "kiwipiepy>=0.17.0",
  "openai>=1.68.0",
  "jsonschema>=4.18",
  "tiktoken>=0.7",
  "tqdm>=4.66",
  "langgraph>=0.2",
  "pykrx>=1.0.48",
  "yfinance>=0.2.40",
  "matplotlib>=3.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
eval = [
  "bert-score",
  "pdfplumber>=0.11.9",
  "torch>=2.14.0",
  "transformers>=5.17.0",
]
dev = [
  "pytest>=9.1.1",
]

[project.scripts]
financial-report = "orchestration.full_report_pipeline:main"
agent-team-loop = "orchestration.cli:main"
financial-dart = "Agent_Team.Financial_Agent.main:main"
financial-index = "Agent_Team.Financial_Agent.financial_index_calculator:main"
financial-analyst-agent = "Agent_Team.Financial_Agent.langgraph_flow:main"
news-workflow = "Agent_Team.News_Agent.cli:main"
news-analysis-agent = "Agent_Team.News_Agent.analysis_agent:main"
strategy-agent = "Agent_Team.Strategy_Agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "run_config/tests"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["Agent_Team*", "shared*", "orchestration*"]
exclude = ["*__pycache__*"]

[tool.setuptools.package-data]
"Agent_Team.Competitor_Agent" = ["prompts/*.md"]
"Agent_Team.Strategy_Agent" = ["prompts/*.md"]
