model: gpt-4.1
decision_horizon: 1개월

# Complete request budget, including system prompt and strict JSON schema.
target_input_tokens: 75000
hard_input_tokens: 90000
max_output_tokens: 12000

# 0 keeps every raw news event initially. If the complete request exceeds the
# target, the builder removes the lowest deterministic score first while
# retaining at least this many news events for each company.
max_news_items_per_company: 0
min_news_items_per_company: 10

temperature: 0.0
timeout_seconds: 300
transport_retries: 0
strict_numeric_grounding: true

# Explicitly versioned estimate only. Update this block if OpenAI pricing changes.
pricing:
  model: gpt-4.1
  input_per_million_usd: 2.0
  cached_input_per_million_usd: 0.5
  output_per_million_usd: 8.0
  as_of: "2026-08-04"
